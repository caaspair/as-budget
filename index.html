<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#1B2E28">
<title>Notre budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#F1EEE4;
    --surface:#FFFFFF;
    --surface-soft:#FAF8F2;
    --ink:#22303F;
    --ink-soft:#5C6B7A;
    --ink-faint:#94A0AC;
    --line:#E1DCCC;
    --accent:#2F6F5E;
    --accent-soft:#DCEAE5;
    --gold:#B8843A;
    --gold-soft:#F1E3C9;
    --good:#3E8E5B;
    --good-soft:#DFF0E4;
    --warn:#C98A2B;
    --warn-soft:#F7EAD3;
    --bad:#B4483C;
    --bad-soft:#F7DFDB;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 1px 2px rgba(34,48,63,.06), 0 6px 20px rgba(34,48,63,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    padding-bottom:84px;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  .num{
    font-family:'IBM Plex Mono',monospace;
    font-variant-numeric:tabular-nums;
  }
  ::selection{background:var(--accent-soft);}
  a{color:inherit;}

  /* Header */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:rgba(241,238,228,.92);
    backdrop-filter:blur(8px);
    padding:18px 20px 12px;
    border-bottom:1px solid var(--line);
  }
  .topbar .eyebrow{
    font-size:11px; text-transform:uppercase; letter-spacing:.10em;
    color:var(--ink-faint); font-weight:600; margin-bottom:2px;
  }
  .topbar h1{font-size:22px;}
  .period-switch{
    display:flex; align-items:center; gap:10px; margin-top:10px;
  }
  .period-switch button{
    width:30px;height:30px;border-radius:50%;border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:15px; cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .period-switch .period-label{
    font-weight:600; font-size:14.5px; flex:1; text-align:center;
    text-transform:capitalize;
  }

  main{padding:16px 16px 8px;}
  .screen{display:none;}
  .screen.active{display:block; animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}

  /* Cards */
  .card{
    background:var(--surface);
    border-radius:var(--radius);
    padding:18px;
    box-shadow:var(--shadow);
    margin-bottom:14px;
  }
  .card-title{
    font-size:11px; text-transform:uppercase; letter-spacing:.09em;
    color:var(--ink-faint); font-weight:600; margin-bottom:10px;
  }
  .hero-card{
    background:linear-gradient(155deg,#243B33 0%, #1B2E28 100%);
    color:#F1EEE4;
    border-radius:var(--radius);
    padding:22px 20px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
  }
  .hero-card .card-title{color:#9FC1B4;}
  .hero-amount{font-size:34px; font-weight:600; font-family:'Fraunces',serif;}
  .hero-sub{font-size:13px; color:#B9D2C7; margin-top:6px; line-height:1.5;}
  .hero-split{display:flex; gap:10px; margin-top:16px;}
  .hero-split div{flex:1; background:rgba(255,255,255,.08); border-radius:var(--radius-sm); padding:10px 12px;}
  .hero-split .lbl{font-size:10.5px; color:#9FC1B4; text-transform:uppercase; letter-spacing:.06em;}
  .hero-split .val{font-size:16px; font-weight:600; margin-top:3px; font-family:'IBM Plex Mono',monospace;}

  .stat-row{display:flex; gap:10px; margin-bottom:14px;}
  .stat-box{
    flex:1; background:var(--surface); border-radius:var(--radius); padding:14px;
    box-shadow:var(--shadow);
  }
  .stat-box .lbl{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; font-weight:600;}
  .stat-box .val{font-size:18px; font-weight:600; margin-top:5px;}
  .stat-box .val.good{color:var(--good);}
  .stat-box .val.bad{color:var(--bad);}

  /* Gauge (signature element) */
  .gauge-item{padding:12px 0; border-bottom:1px solid var(--line);}
  .gauge-item:last-child{border-bottom:none;}
  .gauge-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; gap:8px;}
  .gauge-name{font-weight:600; font-size:14.5px; display:flex; align-items:center; gap:6px;}
  .gauge-tag{font-size:9.5px; padding:2px 6px; border-radius:20px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  .gauge-tag.mensuel{background:var(--accent-soft); color:var(--accent);}
  .gauge-tag.echeance{background:var(--gold-soft); color:var(--gold);}
  .owner-tag{font-size:9.5px; padding:2px 6px; border-radius:20px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  .owner-tag.commun{background:var(--accent-soft); color:var(--accent);}
  .owner-tag.moi{background:#E3E8F0; color:#3E5C76;}
  .owner-tag.amelia{background:var(--gold-soft); color:var(--gold);}
  .gauge-figures{font-size:12.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; white-space:nowrap;}
  .gauge-track{
    position:relative; height:10px; background:#EDEAE0; border-radius:20px; overflow:visible;
  }
  .gauge-fill{
    position:absolute; left:0; top:0; height:100%; border-radius:20px;
    background:var(--accent); transition:width .4s ease;
  }
  .gauge-fill.warn{background:var(--warn);}
  .gauge-fill.bad{background:var(--bad);}
  .gauge-target{
    position:absolute; top:-3px; width:2px; height:16px; background:var(--ink);
    border-radius:2px; opacity:.55;
  }
  .gauge-delta{font-size:12px; margin-top:6px; font-weight:600;}
  .gauge-delta.good{color:var(--good);}
  .gauge-delta.bad{color:var(--bad);}

  .group-header{
    font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase;
    letter-spacing:.06em; margin:22px 0 8px 4px;
  }
  .group-header:first-child{margin-top:0;}

  /* Grille de cartes pour le suivi par catégorie */
  .gauges-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:10px;
  }
  .gauge-item.gauge-card{
    background:var(--surface-soft); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; margin:0;
  }

  /* Bilan du mois : colonnes Revenus / Dépenses */
  .bilan-grid{display:flex; gap:22px; flex-wrap:wrap;}
  .bilan-col{flex:1; min-width:230px;}
  .bilan-col-title{
    font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:.05em;
    margin-bottom:8px;
  }
  .bilan-col-title.good{color:var(--good);}
  .bilan-col-title.bad{color:var(--bad);}
  .mini-group-label{
    font-size:11px; font-weight:700; color:var(--ink-faint); text-transform:uppercase;
    letter-spacing:.05em; margin:10px 0 4px;
  }
  .mini-group-label:first-child{margin-top:0;}
  @media (max-width:600px){ .bilan-grid{flex-direction:column; gap:6px;} }

  details > summary{ list-style:none; }
  details > summary::-webkit-details-marker{ display:none; }

  /* Buttons */
  .btn{
    border:none; border-radius:12px; padding:12px 16px; font-family:'Inter'; font-weight:600;
    font-size:14.5px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-primary{background:var(--accent); color:#fff; width:100%;}
  .btn-ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line);}
  .btn-danger{background:var(--bad-soft); color:var(--bad);}
  .btn-sm{padding:7px 12px; font-size:13px; border-radius:9px;}
  .btn-block{width:100%;}
  .fab{
    position:fixed; bottom:92px; right:calc(50% - 240px + 18px); z-index:15;
    width:54px; height:54px; border-radius:50%; background:var(--accent); color:#fff;
    border:none; box-shadow:0 8px 20px rgba(47,111,94,.4); font-size:26px; cursor:pointer;
  }
  @media (max-width:520px){ .fab{right:18px;} }

  /* Bottom nav */
  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:var(--surface); border-top:1px solid var(--line);
    display:flex; max-width:480px; margin:0 auto;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabbar button{
    flex:1; background:none; border:none; padding:10px 4px 8px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--ink-faint); font-family:'Inter'; font-size:10.5px; font-weight:600;
  }
  nav.tabbar button.active{color:var(--accent);}
  nav.tabbar svg{width:21px; height:21px;}

  /* Lists */
  .tx-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line);}
  .tx-row:last-child{border-bottom:none;}
  .tx-dot{width:9px;height:9px;border-radius:50%; flex-shrink:0;}
  .tx-mid{flex:1; min-width:0;}
  .tx-cat{font-weight:600; font-size:14px;}
  .tx-meta{font-size:12px; color:var(--ink-faint); margin-top:1px;}
  .tx-amt{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14.5px; white-space:nowrap;}
  .tx-amt.rev{color:var(--good);}
  .tx-amt.dep{color:var(--ink);}
  .tx-row{position:relative;}
  .tx-actions{display:flex; gap:6px; margin-left:6px;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--ink-faint); padding:4px; font-size:15px;}

  .empty-state{text-align:center; padding:40px 20px; color:var(--ink-faint);}
  .empty-state .em-icon{font-size:34px; margin-bottom:8px;}
  .empty-state p{font-size:13.5px; line-height:1.5; margin:4px 0 0;}

  input, select, textarea{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface-soft); font-family:'Inter'; font-size:14.5px; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
  label{font-size:12.5px; font-weight:600; color:var(--ink-soft); display:block; margin:12px 0 5px;}
  label:first-child{margin-top:0;}
  .field-row{display:flex; gap:10px;}
  .field-row > div{flex:1;}
  .seg{display:flex; background:var(--surface-soft); border:1px solid var(--line); border-radius:10px; padding:3px;}
  .seg button{flex:1; border:none; background:none; padding:8px; border-radius:8px; font-weight:600; font-size:13.5px; cursor:pointer; color:var(--ink-soft);}
  .seg button.active{background:var(--accent); color:#fff;}

  /* Modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,26,32,.5); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .modal-backdrop.open{opacity:1; pointer-events:auto;}
  .modal-sheet{
    background:var(--bg); width:100%; max-width:480px; border-radius:20px 20px 0 0;
    max-height:88vh; overflow-y:auto; padding:18px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(16px); transition:transform .22s ease;
  }
  .modal-backdrop.open .modal-sheet{transform:translateY(0);}
  .modal-handle{width:36px; height:4px; background:var(--line); border-radius:4px; margin:0 auto 14px;}
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .modal-head h2{font-size:19px;}
  .modal-close{background:none;border:none;font-size:20px;color:var(--ink-faint); cursor:pointer; padding:4px;}
  .modal-foot{display:flex; gap:10px; margin-top:18px;}
  .modal-foot .btn{flex:1;}

  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:30px; font-size:13.5px;
    font-weight:500; z-index:80; opacity:0; transition:all .25s ease; pointer-events:none;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .helper-note{
    font-size:12px; color:var(--ink-faint); line-height:1.5; margin-top:8px;
  }
  .link{color:var(--accent); font-weight:600; cursor:pointer; text-decoration:underline;}
  .badge-count{background:var(--gold); color:#fff; border-radius:20px; font-size:10px; padding:1px 6px; font-weight:700;}
  table.csvprev{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.csvprev th{text-align:left; font-size:10.5px; text-transform:uppercase; color:var(--ink-faint); padding:6px 4px; border-bottom:1px solid var(--line);}
  table.csvprev td{padding:5px 4px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.csvprev select, table.csvprev input{padding:6px 7px; font-size:12.5px;}
  .loading-screen{display:flex; align-items:center; justify-content:center; min-height:100vh; flex-direction:column; gap:10px; color:var(--ink-soft); font-family:'Fraunces',serif; font-size:16px;}
  .login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:linear-gradient(155deg,#243B33 0%, #1B2E28 100%);
  }
  .login-card{
    background:var(--surface); border-radius:20px; padding:32px 26px; width:100%; max-width:360px;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
  }
  .login-card h1{font-size:24px; margin-bottom:6px;}
  .login-card p{color:var(--ink-faint); font-size:13.5px; margin:0 0 20px;}
  .login-error{color:var(--bad); font-size:13px; margin-top:8px; min-height:16px;}
  .logout-link{font-size:12.5px; color:var(--ink-faint); text-decoration:underline; cursor:pointer;}

  /* ===== Version bureau (grand écran) : menu latéral + mise en page large ===== */
  @media (min-width:900px){
    body{ display:flex; justify-content:center; padding:28px 20px; }
    #app{
      max-width:1180px; width:100%; min-height:auto;
      display:flex; align-items:flex-start; gap:28px;
      padding-bottom:0; background:transparent;
    }
    nav.tabbar{
      position:sticky; top:28px; left:auto; right:auto; bottom:auto;
      flex-direction:column; align-items:stretch; justify-content:flex-start;
      width:196px; min-width:196px; max-width:196px;
      border-top:none; border-right:1px solid var(--line);
      background:var(--surface); border-radius:var(--radius);
      padding:16px 10px; margin:0; gap:4px;
      box-shadow:var(--shadow);
    }
    nav.tabbar button{
      flex-direction:row; justify-content:flex-start; gap:12px;
      padding:11px 14px; border-radius:10px; font-size:14px;
    }
    nav.tabbar button.active{ background:var(--accent-soft); color:var(--accent); }
    nav.tabbar svg{width:20px; height:20px;}
    .screen{ flex:1; min-width:0; background:var(--bg); border-radius:var(--radius); }
    .screen.active{ display:block; }
    .topbar{
      position:static; background:transparent; backdrop-filter:none;
      border-bottom:none; padding:4px 4px 16px;
    }
    .topbar h1{font-size:28px;}
    main{
      padding:0 4px 40px;
      display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:18px; align-items:start;
    }
    #screen-dashboard main > .hero-card{ grid-column:1 / -1; }
    #screen-tx main, #screen-budget main, #screen-accounts main, #screen-recap main{
      display:block;
    }
    .card, .hero-card{ padding:20px; }
    .card-title{font-size:15px;}
    .fab{ position:fixed; right:32px; bottom:32px; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="loading" class="loading-screen">Chargement du budget…</div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal-sheet" id="modalSheet"></div></div>

<script>
/* ============================= FIREBASE ============================= */
const firebaseConfig = {
  apiKey: "AIzaSyALDhaMZPDmlOBNsTjpHrV-yFGisnGFcSw",
  authDomain: "as-budget.firebaseapp.com",
  projectId: "as-budget",
  storageBucket: "as-budget.firebasestorage.app",
  messagingSenderId: "188859717863",
  appId: "1:188859717863:web:e5d8f2b6cc9a4c73a42a42",
  measurementId: "G-5F61KT8T8R"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let appStarted = false;

function renderLogin(errorMsg){
  document.getElementById('app').innerHTML = `
    <div class="login-screen">
      <div class="login-card">
        <h1>Notre budget</h1>
        <p>Connecte-toi pour accéder à vos comptes partagés.</p>
        <label>E-mail</label>
        <input type="email" id="loginEmail" autocomplete="username" placeholder="ton@email.com">
        <label>Mot de passe</label>
        <input type="password" id="loginPass" autocomplete="current-password" placeholder="••••••••">
        <button class="btn btn-primary btn-block" id="loginBtn" style="margin-top:18px;">Se connecter</button>
        <div class="login-error">${errorMsg||''}</div>
      </div>
    </div>
  `;
  const doLogin = ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    if(!email || !pass){ renderLogin('Renseigne un e-mail et un mot de passe.'); return; }
    document.getElementById('loginBtn').textContent = 'Connexion...';
    auth.signInWithEmailAndPassword(email, pass).catch(err=>{
      renderLogin("Identifiants incorrects. Vérifie l'e-mail et le mot de passe.");
    });
  };
  document.getElementById('loginBtn').onclick = doLogin;
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).finally(()=>{
  auth.onAuthStateChanged(user=>{
    if(user){
      if(!appStarted){ appStarted = true; init(); }
    } else {
      appStarted = false;
      renderLogin();
    }
  });
});
const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const fmt = n => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(n||0);
const fmtSigned = n => (n>=0?'+':'') + fmt(n);
const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const todayISO = () => new Date().toISOString().slice(0,10);
const isLeap = y => (y%4===0 && y%100!==0) || y%400===0;
const dayOfYear = d => { const start = new Date(d.getFullYear(),0,1); return Math.floor((d-start)/864e5)+1; };
const daysInYear = y => isLeap(y)?366:365;
const lastDayOfMonth = (y,m) => new Date(y, m, 0).getDate(); // m is 1-indexed month
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============================= ETAT ============================= */
let STATE = {
  config: null,        // {accounts:[], categories:[]}
  txByYear: {},         // {2026:[...]}
  currentYear: new Date().getFullYear(),
  currentMonth: new Date().getMonth()+1, // 1-12, used for dashboard month focus
  activeScreen: 'dashboard',
  txFilterMonth: 'all', // 'all' or 1-12, for movements screen
  recapScope: 'commun', // 'commun' or 'tous', for the récap screen
  recapYear: new Date().getFullYear(),
};

function defaultConfig(){
  const today = todayISO();
  const acc = (name, owner='commun') => ({id:uid(), name, balance:0, balanceDate:today, owner});
  const dep = (name, group, annual, mode, dueMonth=null, owner='commun') => ({id:uid(), type:'depense', name, group, annual, mode, dueMonth, owner, overrides:{}, rollover:{}});
  const rev = (name, annual, owner='commun') => ({id:uid(), type:'revenu', name, group:'Revenus', annual, mode:'mensuel', dueMonth:null, owner, overrides:{}, rollover:{}});
  return {
    accounts:[
      acc('Crédit Mutuel — Compte courant','commun'),
      acc('Crédit Mutuel — Livret Bleu','commun'),
      acc('Crédit Mutuel — Assurance vie','commun'),
      acc('N26 — Compte courant','moi'),
      acc('Boursorama — Commun','commun'),
      acc('Boursorama — Perso','moi'),
      acc('Lydia','moi'),

const yearListeners = {};

function loadConfig(){
  return new Promise((resolve)=>{
    db.collection('budget').doc('config').onSnapshot(snap=>{
      if(snap.exists){
        STATE.config = snap.data();
      } else if(!configListenerAttached){
        STATE.config = defaultConfig();
        db.collection('budget').doc('config').set(STATE.config).catch(e=>console.error(e));
      }
      const wasAttached = configListenerAttached;
      configListenerAttached = true;
      resolve();

function loadYear(year){
  if(yearListeners[year]) return Promise.resolve(STATE.txByYear[year]||[]);
  return new Promise((resolve)=>{
    let first = true;
    db.collection('budget').doc('tx_'+year).onSnapshot(snap=>{
      STATE.txByYear[year] = snap.exists ? (snap.data().list||[]) : [];
      if(first){ first = false; resolve(STATE.txByYear[year]); }

    }, err=>{ console.error('year listener error', year, err); STATE.txByYear[year] = STATE.txByYear[year]||[]; resolve(STATE.txByYear[year]); });

  });

// Report d'une échéance d'une année sur l'autre (garder en épargne / reporter)
function effectiveAnnual(cat, year){
  const prev = cat.yearlyRollover && cat.yearlyRollover[year-1];
  const bump = (prev && prev.choice==='report') ? Number(prev.amount) : 0;
  return Number(cat.annual||0) + bump;
}

// Montant mensuel de base pour une catégorie mensuelle, en tenant compte d'un changement programmé
function baseMonthlyAmount(cat, year, month){
  const key = monthKey(year, month);
  if(cat.overrides && cat.overrides[key]!=null && cat.overrides[key]!=='') return Number(cat.overrides[key]);
  if(isScheduledChangeActive(cat, key)){
    return Number(cat.scheduledChange.amount);
  }
  return effectiveAnnual(cat, year)/12;
}
// Un changement programmé est actif entre fromKey et toKey (inclus). Sans toKey, il reste actif indéfiniment.
function isScheduledChangeActive(cat, key){
  const sc = cat.scheduledChange;
  if(!sc || !sc.fromKey) return false;
  if(key < sc.fromKey) return false;
  if(sc.toKey && key > sc.toKey) return false;
  return true;
}

// Cible cumulée théorique à une date donnée, pour une catégorie
function cibleCumulee(cat, date){
  const y = date.getFullYear();
  const annual = effectiveAnnual(cat, y);
  const doy = dayOfYear(date);
  const totalDays = daysInYear(y);
  if(cat.mode === 'mensuel'){
    // Sans changement programmé / dépense temporaire : proration simple sur l'année.
    if(!cat.scheduledChange || !cat.scheduledChange.fromKey) return annual * (doy/totalDays);
    // Avec une période définie (dépense temporaire ou changement daté) : on additionne mois par mois,
    // en utilisant le montant de la période quand elle est active, sinon le montant de base.
    let total = 0;
    for(let m=1; m<=12; m++){
      const monthStart = new Date(y, m-1, 1);
      if(monthStart > date) break;
      const key = monthKey(y, m);
      const amt = isScheduledChangeActive(cat, key) ? Number(cat.scheduledChange.amount) : annual/12;
      const isCurrentMonth = date.getFullYear()===y && date.getMonth()+1===m;
      if(isCurrentMonth){
        const daysInMonth = new Date(y, m, 0).getDate();
        total += amt * (date.getDate()/daysInMonth);
      } else {
        total += amt;
      }
    }
    return total;
  } else {
    const dueDay = dayOfYear(new Date(y, cat.dueMonth, 0)); // last day of dueMonth
    if(doy >= dueDay) return annual;
    return annual * (doy/dueDay);
  }
}
function mensualiteConseillee(cat, year){
  const y = year || new Date().getFullYear();
  const annual = effectiveAnnual(cat, y);
  if(cat.mode === 'mensuel') return annual/12;
  return annual / cat.dueMonth;
}
function monthKey(year, month){ return `${year}-${String(month).padStart(2,'0')}`; }
function monthsBetweenInclusive(fromKey, toKey){
  const [fy,fm] = fromKey.split('-').map(Number);
  const [ty,tm] = toKey.split('-').map(Number);
  return (ty-fy)*12 + (tm-fm) + 1;
}
function reportInAmount(cat, year, month){
  const [py, pm] = month===1 ? [year-1, 12] : [year, month-1];
  const key = monthKey(py, pm);
  const entry = cat.rollover && cat.rollover[key];
  return (entry && entry.choice==='report') ? Number(entry.amount) : 0;
}
function monthlyPrevu(cat, year, month){
  const base = baseMonthlyAmount(cat, year, month);
  return cat.type==='depense' ? base + reportInAmount(cat, year, month) : base;
}
function monthlyReel(cat, year, month){
  const key = monthKey(year, month);
  const list = STATE.txByYear[year] || [];
  return list.filter(t=> t.categoryId===cat.id && t.type===cat.type && t.date.slice(0,7)===key)
              .reduce((s,t)=>s+Number(t.amount||0), 0);
}
function totalEpargneViaBudgets(){
  let total = 0;
  STATE.config.categories.filter(c=>c.type==='depense').forEach(c=>{
    Object.values(c.rollover||{}).forEach(entry=>{ if(entry.choice==='epargne') total += Number(entry.amount||0); });
    Object.values(c.yearlyRollover||{}).forEach(entry=>{ if(entry.choice==='epargne') total += Number(entry.amount||0); });
  });
  return total;
}
function sommeCategorie(year, catId, type, uptoDateISO){
  const list = STATE.txByYear[year] || [];
  return list.filter(t => t.categoryId===catId && t.type===type && (!uptoDateISO || t.date <= uptoDateISO))
              .reduce((s,t)=>s+Number(t.amount||0), 0);
}
// Solde théorique d'un compte aujourd'hui = solde pointé + mouvements depuis balanceDate
function soldeTheorique(acc){
  let solde = Number(acc.balance||0);
  const yearsToCheck = new Set([new Date(acc.balanceDate).getFullYear(), new Date().getFullYear()]);
  for(const y of yearsToCheck){
    const list = STATE.txByYear[y];
    if(!list) continue;
    for(const t of list){
      if(t.date <= acc.balanceDate) continue;
      if(t.date > todayISO()) continue;
      if(t.type==='virement'){
        if(t.fromAccountId===acc.id) solde -= Number(t.amount||0);
        if(t.toAccountId===acc.id) solde += Number(t.amount||0);
      } else if(t.accountId===acc.id){
        solde += (t.type==='revenu' ? Number(t.amount) : -Number(t.amount));
      }
    }
  }
  return solde;
}
function accountOwnerOfTx(t){
  const acc = accById(t.accountId);
  return acc ? ownerOf(acc) : 'commun';
}
function categoryScopeOwner(cat){
  if(cat.accountId){ const acc = accById(cat.accountId); if(acc) return ownerOf(acc); }
  return ownerOf(cat);
}
function accountEcheanceReserve(acc){
  const y = new Date().getFullYear();
  const today = new Date();
  return STATE.config.categories.filter(c=>c.type==='depense' && c.mode==='echeance' && c.accountId===acc.id)
    .reduce((s,c)=> s + Math.max(0, cibleCumulee(c, today) - sommeCategorie(y, c.id, 'depense', todayISO())), 0);
}
function accountMonthlyBudget(acc){
  const now = new Date();
  return STATE.config.categories.filter(c=>c.type==='depense' && c.mode==='mensuel' && c.accountId===acc.id)
    .reduce((s,c)=> s + monthlyPrevu(c, now.getFullYear(), now.getMonth()+1), 0);
}
// Ce qu'il reste encore à dépenser ce mois-ci (catégories mensuelles liées) + ce qui devrait déjà
// être provisionné pour les échéances liées à ce compte : le montant que le compte "devrait" contenir.
function accountRemainingThisMonth(acc, year, month){
  const mensuel = STATE.config.categories.filter(c=>c.type==='depense' && c.mode==='mensuel' && c.accountId===acc.id)
    .reduce((s,c)=> s + Math.max(0, monthlyPrevu(c, year, month) - monthlyReel(c, year, month)), 0);
  const echeance = accountEcheanceReserve(acc);
  return mensuel + echeance;
}
// Préférence d'affichage (par navigateur) : quels comptes montrer dans le tableau de bord.
function getDashboardAccountFilter(){
  try {

}
function setDashboardAccountFilter(ids){

}
function renderAccountBarChart(accounts, year, month){
  if(!accounts.length) return `<div class="empty-state" style="padding:16px;"><p>Sélectionnez au moins un compte ci-dessus.</p></div>`;
  const data = accounts.map(a=>({
    id: a.id,
    name: a.name,
    reel: soldeTheorique(a),
    prevu: accountRemainingThisMonth(a, year, month)
  }));
  const max = Math.max(...data.flatMap(d=>[Math.abs(d.reel), Math.abs(d.prevu)]), 1);
  const groups = data.map(d=>{
    const hReel = clamp((Math.max(d.reel,0)/max)*100, d.reel>0.5?4:0, 100);
    const hPrevu = clamp((Math.max(d.prevu,0)/max)*100, d.prevu>0.5?4:0, 100);
    const ok = d.reel >= d.prevu;
    return `<div style="flex:1;min-width:70px;display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="display:flex;gap:5px;align-items:flex-end;height:130px;">
        <div style="width:22px;height:130px;background:#EDEAE0;border-radius:6px 6px 0 0;display:flex;align-items:flex-end;overflow:hidden;" title="Réel : ${fmt(d.reel)}">
          <div style="width:100%;height:${hReel}%;background:${ok?'var(--accent)':'#D96C6C'};border-radius:6px 6px 0 0;transition:height .4s ease;"></div>
        </div>
        <div style="width:22px;height:130px;background:#EDEAE0;border-radius:6px 6px 0 0;display:flex;align-items:flex-end;overflow:hidden;" title="À prévoir : ${fmt(d.prevu)}">
          <div style="width:100%;height:${hPrevu}%;background:#C9B98A;border-radius:6px 6px 0 0;transition:height .4s ease;"></div>
        </div>
      </div>
      <div style="font-size:10px;color:var(--ink-faint);text-align:center;white-space:nowrap;">${fmt(d.reel)} / ${fmt(d.prevu)}</div>
      <div style="font-size:10.5px;font-weight:600;color:var(--ink-soft);text-align:center;max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${d.name}">${d.name}</div>
    </div>`;
  }).join('');
  return `
    <div style="display:flex;gap:16px;align-items:flex-end;overflow-x:auto;padding-bottom:4px;">${groups}</div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--ink-soft);">
      <div><span style="display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:3px;margin-right:5px;vertical-align:-1px;"></span>Réel (suffisant)</div>
      <div><span style="display:inline-block;width:10px;height:10px;background:#D96C6C;border-radius:3px;margin-right:5px;vertical-align:-1px;"></span>Réel (insuffisant)</div>
      <div><span style="display:inline-block;width:10px;height:10px;background:#C9B98A;border-radius:3px;margin-right:5px;vertical-align:-1px;"></span>À prévoir</div>
    </div>
  `;
}
function renderAccountMonthlyCard(year, month){
  const all = STATE.config.accounts;
  if(!all.length){
    return `<div class="card"><div class="card-title">Comptes — ${MONTHS[month-1]}</div><div class="empty-state" style="padding:16px;"><p>Aucun compte pour l'instant.</p></div></div>`;
  }
  const filter = getDashboardAccountFilter();
  const selectedIds = (filter && filter.length) ? filter : all.map(a=>a.id);
  const chips = all.map(a=>{
    const active = selectedIds.includes(a.id);
    return `<button type="button" class="btn btn-sm acct-chip" data-id="${a.id}"
      style="border-radius:999px;padding:6px 12px;font-size:12.5px;border:1px solid var(--line);
      background:${active?'var(--accent)':'var(--surface)'};color:${active?'#fff':'var(--ink)'};">${a.name}</button>`;
  }).join('');
  const shown = all.filter(a=>selectedIds.includes(a.id));
  const chart = renderAccountBarChart(shown, year, month);
  const deltaList = shown.map(a=>{
    const reel = soldeTheorique(a);
    const necessaire = accountRemainingThisMonth(a, year, month);
    const delta = reel - necessaire;
    const owner = ownerOf(a);
    const ownerTag = owner!=='commun' ? `<span class="owner-tag ${owner}">${OWNER_LABEL[owner]}</span>` : '';
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;">
      <span>${a.name} ${ownerTag}</span>
      <span class="${delta>=0?'good':'bad'}" style="font-weight:600;">${delta>=0?'Marge de '+fmt(delta):'Il manque '+fmt(-delta)}</span>
    </div>`;
  }).join('');
  return `
    <div class="card">
      <div class="card-title">Comptes — ${MONTHS[month-1]} : réel vs à prévoir</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">${chips}</div>
      ${chart}
      ${deltaList ? `<div style="margin-top:14px;">${deltaList}</div>` : ''}
      <details style="margin-top:10px;">
        <summary style="cursor:pointer;font-size:11.5px;color:var(--ink-faint);">ℹ️ Comment lire ce graphique ?</summary>
        <div class="helper-note" style="margin-top:6px;">« À prévoir » = ce qu'il reste à dépenser ce mois sur les catégories liées à ce compte, plus ce qui devrait déjà être mis de côté pour les échéances liées. Cliquez sur un compte pour l'afficher ou le masquer.</div>
      </details>
    </div>
  `;
}
function wireAccountMonthlyCardEvents(){
  document.querySelectorAll('.acct-chip').forEach(b=>{
    b.onclick = ()=>{
      const all = STATE.config.accounts.map(a=>a.id);
      const current = getDashboardAccountFilter() || all;
      let next;
      if(current.includes(b.dataset.id)){
        next = current.filter(id=>id!==b.dataset.id);
      } else {
        next = current.concat([b.dataset.id]);
      }
      // si tout est sélectionné, on retombe sur "null" (tous) pour rester simple
      setDashboardAccountFilter(next.length===all.length ? null : next);
      renderDashboard();
    };
  });
}

    <div class="screen" id="screen-accounts"></div>
    <nav class="tabbar">
      <button data-tab="dashboard" class="active">${iconFor('dashboard')}Accueil</button>
      <button data-tab="recap">${iconFor('recap')}Récap</button>
      <button data-tab="tx">${iconFor('tx')}Mouvements</button>
      <button data-tab="budget">${iconFor('budget')}Budgets</button>
      <button data-tab="accounts">${iconFor('accounts')}Comptes</button>
    </nav>
  `;
  document.querySelectorAll('nav.tabbar button').forEach(b=>{
    b.addEventListener('click', ()=> switchTab(b.dataset.tab));
  });
  renderAll();
}

function switchTab(tab){
  STATE.activeScreen = tab;
  document.querySelectorAll('nav.tabbar button').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.screen').forEach(s=> s.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  renderAll();
}

async function ensureYearLoaded(year){
  if(!STATE.txByYear[year]) await loadYear(year);
}

function renderAll(){
  if(STATE.activeScreen==='dashboard') renderDashboard();
  if(STATE.activeScreen==='tx') renderTx();
  if(STATE.activeScreen==='recap') renderRecap();
  if(STATE.activeScreen==='budget') renderBudget();
  if(STATE.activeScreen==='accounts') renderAccounts();
}

function renderAccountOverviewRows(){
  const accounts = STATE.config.accounts;
  if(!accounts.length) return `<div class="empty-state" style="padding:16px;"><p>Aucun compte pour l'instant.</p></div>`;
  return accounts.map(a=>{
    const solde = soldeTheorique(a);
    const reserve = accountEcheanceReserve(a);
    const monthlyB = accountMonthlyBudget(a);
    const owner = ownerOf(a);
    const ownerTag = owner!=='commun' ? `<span class="owner-tag ${owner}">${OWNER_LABEL[owner]}</span>` : '';
    if(reserve > 0.5){
      const scaleMax = Math.max(solde, reserve, 1);
      const pct = clamp(solde/scaleMax*100, 0, 100);
      const targetPct = clamp(reserve/scaleMax*100, 0, 100);
      const delta = solde - reserve;
      const barClass = delta>=0 ? '' : (solde >= reserve*0.7 ? 'warn' : 'bad');
      return `<div class="gauge-item">
        <div class="gauge-top">
          <div class="gauge-name">${a.name} ${ownerTag}</div>
          <div class="gauge-figures">${fmt(solde)} / ${fmt(reserve)} prévu</div>
        </div>
        <div class="gauge-track">
          <div class="gauge-fill ${barClass}" style="width:${pct}%"></div>
          <div class="gauge-target" style="left:${targetPct}%"></div>
        </div>
        <div class="gauge-delta ${delta>=0?'good':'bad'}">${delta>=0?'Marge de '+fmt(delta):'Il manque '+fmt(-delta)} par rapport à ce qui devrait être réservé sur ce compte</div>
      </div>`;
    }
    return `<div class="gauge-item">
      <div class="gauge-top">
        <div class="gauge-name">${a.name} ${ownerTag}</div>
        <div class="gauge-figures">${fmt(solde)}</div>
      </div>
      ${monthlyB>0.5
        ? `<div class="gauge-delta" style="color:var(--ink-soft);">Budget mensuel attribué à ce compte : ${fmt(monthlyB)}</div>`
        : `<div class="gauge-delta" style="color:var(--ink-faint);">Aucune catégorie liée à ce compte pour l'instant</div>`}
    </div>`;
  }).join('');
}
function coachMessage(revenus, depenses){
  if(revenus<=0 && depenses<=0) return "👋 Ajoutez vos premiers mouvements pour voir vos stats prendre vie.";
  const taux = revenus>0 ? (revenus-depenses)/revenus : 0;
  if(taux >= 0.2) return `🌟 Superbe ! Vous épargnez ${Math.round(taux*100)}% de vos revenus cette année.`;
  if(taux >= 0.05) return `👍 Vous êtes dans le vert, taux d'épargne de ${Math.round(taux*100)}%.`;
  if(taux >= 0) return "🙂 Ça s'équilibre — de quoi surveiller les prochains mois.";
  return "⚠️ Les dépenses dépassent les revenus cette année — un point d'attention.";
}
function renderTrendChart(){
  const now = new Date();
  const months = [];
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({y:d.getFullYear(), m:d.getMonth()+1, label:MONTHS[d.getMonth()].slice(0,3)});
  }
  months.forEach(({y})=>{ if(!STATE.txByYear[y]) ensureYearLoaded(y); });
  const totals = months.map(({y,m})=>{
    const list = STATE.txByYear[y] || [];
    const ms = String(m).padStart(2,'0');
    return list.filter(t=>t.type==='depense' && t.date.slice(5,7)===ms && t.date.slice(0,4)===String(y))
                .reduce((s,t)=>s+Number(t.amount||0), 0);
  });
  const max = Math.max(...totals, 1);
  const bars = months.map((mo,i)=>{
    const h = clamp((totals[i]/max)*100, totals[i]>0?4:0, 100);
    const isCurrent = i===months.length-1;
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div class="num" style="font-size:9.5px;color:var(--ink-faint);">${Math.round(totals[i])}€</div>
      <div style="width:100%;max-width:30px;height:64px;background:#EDEAE0;border-radius:6px;display:flex;align-items:flex-end;overflow:hidden;">
        <div style="width:100%;height:${h}%;background:${isCurrent?'var(--accent)':'#C9B98A'};border-radius:6px 6px 0 0;transition:height .5s ease;"></div>
      </div>
      <div style="font-size:10.5px;font-weight:600;color:var(--ink-soft);text-transform:capitalize;">${mo.label}</div>
    </div>`;
  }).join('');
  return `<div style="display:flex;gap:6px;align-items:flex-end;">${bars}</div>`;
}

function groupAndRenderGauges(depCats, year, focusDate, todayISOv){
  const groups = {};
  depCats.forEach(c=>{ (groups[c.group] = groups[c.group]||[]).push(c); });
  let html = '';
  Object.keys(groups).forEach(g=>{
    html += `<div class="group-header" style="margin-top:14px;">${g}</div><div class="gauges-grid">`;
    groups[g].forEach(c=>{
      const annual = effectiveAnnual(c, year);
      const cible = cibleCumulee(c, focusDate);
      const depense = sommeCategorie(year, c.id, 'depense', todayISOv);
      const pct = annual>0 ? clamp((depense/annual)*100,0,100) : (depense>0?100:0);
      const targetPct = annual>0 ? clamp((cible/annual)*100,0,100) : 0;
      const delta = cible - depense; // positif = on track / en avance, négatif = dépassement
      const barClass = depense <= cible*1.03 ? '' : (depense <= cible*1.2 ? 'warn' : 'bad');
      html += `
        <div class="gauge-item gauge-card">
          <div class="gauge-top">
            <div class="gauge-name">${iconChip(c)}${c.name} <span class="gauge-tag ${c.mode}">${c.mode==='mensuel'?'mensuel':'échéance '+MONTHS[c.dueMonth-1].slice(0,3)}</span></div>
            <div class="gauge-figures">${fmt(depense)} / ${fmt(annual)}</div>
          </div>
          <div class="gauge-track">
            <div class="gauge-fill ${barClass}" style="width:${pct}%; background:${barClass?'':groupColor(g)};"></div>
            <div class="gauge-target" style="left:${targetPct}%"></div>
          </div>
          <div class="gauge-delta ${delta>=0?'good':'bad'}">${delta>=0 ? 'En avance de '+fmt(delta) : 'Dépassement de '+fmt(-delta)} vs. cible à ce jour</div>
        </div>`;
    });
    html += `</div>`;
  });
  return html || '<div class="empty-state"><div class="em-icon">🗂️</div><p>Ajoutez des catégories dans l’onglet Budgets.</p></div>';
}

function renderMonthlyBilanRows(year, month){
  const cats = STATE.config.categories.filter(c=>c.mode==='mensuel');
  if(!cats.length) return `<div class="empty-state" style="padding:20px;"><p>Aucune catégorie mensuelle.</p></div>`;
  const revCats = cats.filter(c=>c.type==='revenu');
  const depCats = cats.filter(c=>c.type==='depense');
  const revGroups = {moi:[], amelia:[], commun:[]};
  revCats.forEach(c=> (revGroups[ownerOf(c)] = revGroups[ownerOf(c)]||[]).push(c));
  const revGroupLabel = {moi:'Scott', amelia:'Amélia', commun:'Communs'};

  const revHTML = ['moi','amelia','commun'].filter(o=>revGroups[o].length).map(o=>
    `<div class="mini-group-label">${revGroupLabel[o]}</div>`
    + revGroups[o].map(c=>bilanRevenuRow(c,year,month)).join('')
  ).join('') || `<div class="empty-state" style="padding:14px 4px;"><p>Aucun revenu mensuel.</p></div>`;
  const depHTML = depCats.length
    ? depCats.map(c=>bilanDepenseRow(c,year,month)).join('')
    : `<div class="empty-state" style="padding:14px 4px;"><p>Aucune dépense mensuelle.</p></div>`;

  return `
    <div class="bilan-grid">
      <div class="bilan-col">
        <div class="bilan-col-title good">💰 Revenus</div>
        ${revHTML}
      </div>
      <div class="bilan-col">
        <div class="bilan-col-title bad">💸 Dépenses</div>
        ${depHTML}
      </div>
    </div>
  `;
}
function bilanRevenuRow(c, year, month){
  const key = monthKey(year, month);
  const prevu = monthlyPrevu(c, year, month);
  const reel = monthlyReel(c, year, month);
  const diff = reel - prevu;
  const hasOverride = c.overrides && c.overrides[key]!=null && c.overrides[key]!=='';
  return `<div class="gauge-item">
    <div class="gauge-top">
      <div class="gauge-name">${iconChip(c)}${c.name}</div>
      <div class="gauge-figures">${fmt(reel)} reçu / ${fmt(prevu)} prévu${hasOverride?' *':''}</div>
    </div>
    <div class="gauge-delta ${diff>=0?'good':'bad'}">${diff>=0?'Au-dessus du prévu de '+fmt(diff):'En-dessous du prévu de '+fmt(-diff)}</div>
    <span class="link override-edit" data-cat="${c.id}" style="font-size:12px;">✎ Ajuster le prévu de ${MONTHS[month-1]}</span>
  </div>`;
}
function bilanDepenseRow(c, year, month){
  const key = monthKey(year, month);
  const prevu = monthlyPrevu(c, year, month);
  const reel = monthlyReel(c, year, month);
  const pct = prevu>0 ? clamp((reel/prevu)*100,0,100) : (reel>0?100:0);
  const delta = prevu - reel;
  const barClass = reel<=prevu ? '' : (reel<=prevu*1.2?'warn':'bad');
  const existing = c.rollover && c.rollover[key];
  const hasOverride = c.overrides && c.overrides[key]!=null && c.overrides[key]!=='';
  const hasScheduled = isScheduledChangeActive(c, key);
  let actionHTML = '';
  if(existing){
    actionHTML = `<div class="gauge-delta good">✓ ${existing.choice==='epargne'?'Mis en épargne':(existing.amount>=0?'Ajouté au budget du mois prochain':'Déduit du budget du mois prochain')} (${fmtSigned(existing.amount)}) · <span class="link undo-rollover" data-cat="${c.id}" data-key="${key}">annuler</span></div>`;
  } else if(delta > 0.5){
    actionHTML = `<div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;">
      <button class="btn btn-ghost btn-sm rollover-btn" data-cat="${c.id}" data-key="${key}" data-choice="epargne" data-amount="${delta.toFixed(2)}">Garder en épargne (+${fmt(delta)})</button>
      <button class="btn btn-ghost btn-sm rollover-btn" data-cat="${c.id}" data-key="${key}" data-choice="report" data-amount="${delta.toFixed(2)}">Ajouter au mois prochain</button>
    </div>`;
  } else if(delta < -0.5){
    actionHTML = `<div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;">
      <button class="btn btn-ghost btn-sm rollover-btn" data-cat="${c.id}" data-key="${key}" data-choice="report" data-amount="${delta.toFixed(2)}">Répercuter le dépassement sur le mois prochain (${fmt(delta)})</button>
    </div>`;
  }
  return `<div class="gauge-item">
    <div class="gauge-top">
      <div class="gauge-name">${iconChip(c)}${c.name}${hasScheduled?' <span class="owner-tag commun">changement programmé</span>':''}</div>
      <div class="gauge-figures">${fmt(reel)} / ${fmt(prevu)}${hasOverride?' *':''}</div>
    </div>
    <div class="gauge-track"><div class="gauge-fill ${barClass}" style="width:${pct}%"></div></div>
    <div class="gauge-delta ${delta>=0?'good':'bad'}">${delta>=0?'Excédent de '+fmt(delta):'Dépassement de '+fmt(-delta)} ce mois-ci</div>
    ${actionHTML}
    <span class="link override-edit" data-cat="${c.id}" style="font-size:12px;">✎ Ajuster le prévu de ${MONTHS[month-1]}</span>
  </div>`;
}

function echeancesAReconcilier(year){
  const today = new Date();
  if(year !== today.getFullYear()) return [];
  return STATE.config.categories.filter(c=>{
    if(c.type!=='depense' || c.mode!=='echeance') return false;
    const dueEnd = new Date(year, c.dueMonth, 0);
    if(today <= dueEnd) return false;
    const decided = c.yearlyRollover && c.yearlyRollover[year];
    if(decided) return false;
    const delta = effectiveAnnual(c, year) - sommeCategorie(year, c.id, 'depense', todayISO());
    return Math.abs(delta) > 0.5;
  });
}
function renderEcheanceReconciliationCard(year){
  const pending = echeancesAReconcilier(year);
  if(!pending.length) return '';
  const rows = pending.map(c=>{
    const spent = sommeCategorie(year, c.id, 'depense', todayISO());
    const delta = effectiveAnnual(c, year) - spent;
    let actionHTML = '';
    if(delta > 0.5){
      actionHTML = `<div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm yearly-rollover-btn" data-cat="${c.id}" data-year="${year}" data-choice="epargne" data-amount="${delta.toFixed(2)}">Garder en épargne (+${fmt(delta)})</button>
        <button class="btn btn-ghost btn-sm yearly-rollover-btn" data-cat="${c.id}" data-year="${year}" data-choice="report" data-amount="${delta.toFixed(2)}">Ajouter au budget de l'an prochain</button>
      </div>`;
    } else {
      actionHTML = `<div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm yearly-rollover-btn" data-cat="${c.id}" data-year="${year}" data-choice="report" data-amount="${delta.toFixed(2)}">Répercuter le dépassement sur l'an prochain (${fmt(delta)})</button>
      </div>`;
    }
    return `<div class="gauge-item">
      <div class="gauge-top">
        <div class="gauge-name">${iconChip(c)}${c.name}</div>
        <div class="gauge-figures">${fmt(spent)} / ${fmt(effectiveAnnual(c,year))} prévu</div>
      </div>
      <div class="gauge-delta ${delta>=0?'good':'bad'}">${delta>=0?'Il vous reste '+fmt(delta):'Dépassement de '+fmt(-delta)} sur ce poste cette année — que faire ?</div>
      ${actionHTML}
    </div>`;
  }).join('');
  return `
    <div class="card">
      <div class="card-title">Échéances passées à régler</div>
      ${rows}
    </div>
    <div class="helper-note">Ces échéances sont passées cette année — dis-nous quoi faire de l'écart avant de passer à autre chose.</div>
  `;
}

/* ---- Virements à faire (suite à une décision "Épargne") ---- */
function pendingTransfers(){
  const list = [];
  STATE.config.categories.forEach(cat=>{
    Object.entries(cat.rollover||{}).forEach(([key,entry])=>{
      if(entry && entry.choice==='epargne' && entry.fromAccountId && entry.toAccountId && entry.fromAccountId!==entry.toAccountId && !entry.transferDone){
        list.push({catId:cat.id, catName:cat.name, key, kind:'mensuel', amount:entry.amount, fromAccountId:entry.fromAccountId, toAccountId:entry.toAccountId});
      }
    });
    Object.entries(cat.yearlyRollover||{}).forEach(([year,entry])=>{
      if(entry && entry.choice==='epargne' && entry.fromAccountId && entry.toAccountId && entry.fromAccountId!==entry.toAccountId && !entry.transferDone){
        list.push({catId:cat.id, catName:cat.name, key:year, kind:'annuel', amount:entry.amount, fromAccountId:entry.fromAccountId, toAccountId:entry.toAccountId});
      }
    });
  });
  return list;
}
function renderPendingTransfersCard(){
  const pending = pendingTransfers();
  if(!pending.length) return '';
  const rows = pending.map(p=>{
    const from = accById(p.fromAccountId);
    const to = accById(p.toAccountId);
    return `<div class="gauge-item">
      <div class="gauge-top">
        <div class="gauge-name">💸 ${p.catName}</div>
        <div class="gauge-figures">${fmt(p.amount)}</div>
      </div>
      <div class="gauge-delta">Du compte <strong>${from?from.name:'compte inconnu'}</strong> vers <strong>${to?to.name:'compte inconnu'}</strong></div>

/* ---- Import CSV ---- */
function parseFRDate(v){
  if(!v) return null;
  v = String(v).trim();
  let m = v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){
    let [_,d,mo,y] = m;
    if(y.length===2) y = '20'+y;
    return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  const d = new Date(v);
  if(!isNaN(d)) return d.toISOString().slice(0,10);
  return null;
}
function guessCategory(label, type){
  if(!label) return type==='revenu'?UNCAT_REV.id:UNCAT_DEP.id;
  const low = label.toLowerCase();
  const cats = STATE.config.categories.filter(c=>c.type===type);
  const found = cats.find(c => low.includes(c.name.toLowerCase().split(' ')[0].replace(/[^a-zàâäéèêëïîôöùûüç]/gi,'')));
  return found ? found.id : (type==='revenu'?UNCAT_REV.id:UNCAT_DEP.id);
}

let csvRows = [];
function handleCsvFile(e){
  const file = e.target.files[0];
  if(!file) return;
  Papa.parse(file, {
    header:true, skipEmptyLines:true,
    complete: (res)=>{
      if(!res.data.length){ toast('Fichier vide ou illisible'); return; }
      openCsvMappingModal(res.meta.fields, res.data);
    },
    error: ()=> toast('Erreur de lecture du fichier CSV')
  });
  e.target.value = '';
}
function openCsvMappingModal(headers, rows){
  const guess = (words) => headers.find(h => words.some(w=>h.toLowerCase().includes(w))) || headers[0];
  const dateCol = guess(['date']);
  const amountCol = guess(['montant','amount','somme']);
  const labelCol = guess(['libell','label','description','intitul']);

  openModal('Importer un relevé', `
    <p class="helper-note" style="margin-bottom:10px">Indiquez quelles colonnes correspondent à quoi, puis vérifiez la catégorie de chaque ligne.</p>
    <label>Colonne date</label>
    <select id="mapDate">${headers.map(h=>`<option ${h===dateCol?'selected':''}>${h}</option>`).join('')}</select>
    <label>Colonne montant</label>
    <select id="mapAmount">${headers.map(h=>`<option ${h===amountCol?'selected':''}>${h}</option>`).join('')}</select>
    <label>Colonne libellé</label>
    <select id="mapLabel">${headers.map(h=>`<option ${h===labelCol?'selected':''}>${h}</option>`).join('')}</select>
    <label>Compte concerné (pour tout l'import)</label>
    <select id="mapAccount">${accountOptions(STATE.config.accounts[0]?.id)}</select>
    <div class="helper-note">Astuce : dans la plupart des exports bancaires, les montants négatifs sont des dépenses et les positifs des revenus — c'est détecté automatiquement.</div>
  `, `<button class="btn btn-primary" id="csvNextBtn">Continuer →</button>`);

  document.getElementById('csvNextBtn').onclick = ()=>{
    const dc = document.getElementById('mapDate').value;
    const ac = document.getElementById('mapAmount').value;
    const lc = document.getElementById('mapLabel').value;
    const accId = document.getElementById('mapAccount').value;
    csvRows = rows.map(r=>{
      const rawAmt = parseFloat(String(r[ac]).replace(/\s/g,'').replace(',','.'));
      const type = rawAmt < 0 ? 'depense' : 'revenu';
      const date = parseFRDate(r[dc]) || todayISO();
      const label = r[lc] || '';
      return { date, amount: Math.abs(rawAmt||0), type, note: label, accountId: accId, categoryId: guessCategory(label,type) };
    }).filter(r=>r.amount>0);
    openCsvPreviewModal();
  };
}

    renderTx();
  };
}

/* ============================= RÉCAP ============================= */
function totalsByOwner(year){
  const list = STATE.txByYear[year]||[];
  const res = {commun:{rev:0,dep:0}, moi:{rev:0,dep:0}, amelia:{rev:0,dep:0}};
  list.forEach(t=>{
    if(t.type!=='revenu' && t.type!=='depense') return;
    const owner = accountOwnerOfTx(t);
    if(!res[owner]) res[owner] = {rev:0,dep:0};
    if(t.type==='revenu') res[owner].rev += Number(t.amount||0);
    else res[owner].dep += Number(t.amount||0);
  });
  return res;
}
function monthlyRecapRows(year, scope){
  const list = STATE.txByYear[year]||[];
  const rows = [];
  for(let m=1;m<=12;m++){
    const ms = String(m).padStart(2,'0');
    const inMonth = list.filter(t=> t.date.slice(5,7)===ms);
    const inScope = t => scope==='tous' || accountOwnerOfTx(t)===scope;
    const rev = inMonth.filter(t=>t.type==='revenu' && inScope(t)).reduce((s,t)=>s+Number(t.amount||0),0);
    const dep = inMonth.filter(t=>t.type==='depense' && inScope(t)).reduce((s,t)=>s+Number(t.amount||0),0);
    rows.push({m, rev, dep, solde: rev-dep});
  }
  return rows;
}
function focusDateForYear(year){
  const now = new Date();
  if(year < now.getFullYear()) return new Date(year,11,31);
  if(year > now.getFullYear()) return new Date(year,0,1);
  return now;
}
const CHART_COLORS = ['#2F6F5E','#B8843A','#3E5C76','#B4483C','#8E5572','#4C6444','#C9A227','#5B7A8C','#A65B3D','#6B8F71'];
function categoryBreakdown(year, scope){
  const list = STATE.txByYear[year]||[];
  const totals = {};
  list.filter(t=>t.type==='depense').forEach(t=>{
    const cat = catById(t.categoryId);
    if(!cat) return;
    if(scope!=='tous' && accountOwnerOfTx(t)!==scope) return;
    const key = cat.group || 'Autres';
    totals[key] = (totals[key]||0) + Number(t.amount||0);
  });
  return Object.entries(totals).map(([group,total])=>({group,total})).sort((a,b)=>b.total-a.total);
}
function renderDonut(breakdown){
  const total = breakdown.reduce((s,b)=>s+b.total,0);
  if(total<=0) return `<div class="empty-state" style="padding:16px;"><p>Pas encore de dépenses enregistrées pour cette période.</p></div>`;
  let cum = 0;
  const stops = breakdown.map((b,i)=>{
    const pct = b.total/total*100;
    const start = cum;
    cum += pct;
    return `${CHART_COLORS[i % CHART_COLORS.length]} ${start}% ${cum}%`;
  }).join(', ');
  const legend = breakdown.map((b,i)=>{
    const color = CHART_COLORS[i % CHART_COLORS.length];
    const pct = (b.total/total*100).toFixed(0);
    return `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;">
      <span style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0;"></span>
      <span style="flex:1;font-size:13.5px;">${b.group}</span>
      <span class="num" style="font-size:12.5px;color:var(--ink-soft);">${pct}%</span>
      <span class="num" style="font-size:13px;font-weight:600;min-width:72px;text-align:right;">${fmt(b.total)}</span>
    </div>`;
  }).join('');
  return `
    <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
      <div style="position:relative;width:132px;height:132px;flex-shrink:0;">
        <div style="width:132px;height:132px;border-radius:50%;background:conic-gradient(${stops});"></div>
        <div style="position:absolute;inset:20px;background:var(--surface);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;">
          <div style="font-size:9.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;">Total</div>
          <div class="num" style="font-size:13px;font-weight:700;">${fmt(total)}</div>
        </div>
      </div>
      <div style="flex:1;min-width:150px;">${legend}</div>
    </div>
  `;
}

        <button type="button" data-scope="moi" class="${scope==='moi'?'active':''}" style="padding:8px 4px;">Scott</button>
        <button type="button" data-scope="amelia" class="${scope==='amelia'?'active':''}" style="padding:8px 4px;">Amélia</button>
        <button type="button" data-scope="tous" class="${scope==='tous'?'active':''}" style="padding:8px 4px;">Tout</button>
      </div>

      <div class="card">

        <div class="gauge-item">
          <div class="gauge-top"><div class="gauge-name">Revenus</div><div class="gauge-figures">${fmt(totRev)} / ${fmt(revPrevuAnnuel)} prévus</div></div>
          <div class="gauge-track">
            <div class="gauge-fill" style="width:${revPrevuAnnuel>0?clamp(totRev/revPrevuAnnuel*100,0,100):0}%"></div>
            <div class="gauge-target" style="left:${revPrevuAnnuel>0?clamp(revCibleADate/revPrevuAnnuel*100,0,100):0}%"></div>
          </div>

        <div class="gauge-item">
          <div class="gauge-top"><div class="gauge-name">Dépenses</div><div class="gauge-figures">${fmt(totDep)} / ${fmt(depPrevuAnnuel)} prévues</div></div>
          <div class="gauge-track">
            <div class="gauge-fill ${totDep<=depCibleADate?'':(totDep<=depCibleADate*1.2?'warn':'bad')}" style="width:${depPrevuAnnuel>0?clamp(totDep/depPrevuAnnuel*100,0,100):0}%"></div>
            <div class="gauge-target" style="left:${depPrevuAnnuel>0?clamp(depCibleADate/depPrevuAnnuel*100,0,100):0}%"></div>
          </div>
          <div class="gauge-delta ${depEcart>=0?'good':'bad'}">${depEcart>=0?'En avance de '+fmt(depEcart):'Dépassement de '+fmt(-depEcart)} vs cible à ce jour</div>

      </div>

      <div class="card">
        <div class="card-title">Répartition des dépenses ${year} par poste</div>

        <table class="csvprev" style="width:100%;">
          <thead><tr><th>Mois</th><th style="text-align:right">Revenus</th><th style="text-align:right">Dépenses</th><th style="text-align:right">Solde</th></tr></thead>
          <tbody>
            ${rows.map(r=>`
              <tr style="${r.m===currentMonthIdx?'background:var(--surface-soft);':''}">
                <td style="text-transform:capitalize;">${MONTHS[r.m-1]}</td>
                <td class="num" style="text-align:right;color:var(--good);">${fmt(r.rev)}</td>

      <div class="helper-note">Le filtre ci-dessus se base sur le compte utilisé pour chaque mouvement (réglable sur chaque compte dans l'onglet Comptes) — pas sur la catégorie. « Commun » ne montre que ce qui passe par vos comptes communs.</div>
    </main>
  `;

  document.getElementById('recapYearPrev').onclick = async ()=>{ STATE.recapYear--; await ensureYearLoaded(STATE.recapYear); renderRecap(); };
  document.getElementById('recapYearNext').onclick = async ()=>{ STATE.recapYear++; await ensureYearLoaded(STATE.recapYear); renderRecap(); };
  el.querySelectorAll('.seg button').forEach(b=>{
    b.onclick = ()=>{ STATE.recapScope = b.dataset.scope; renderRecap(); };
  });
}

function renderBudget(){
  const el = document.getElementById('screen-budget');

  const groups = {};
  dep.forEach(c=>(groups[c.group]=groups[c.group]||[]).push(c));

  };
  updateSchedHelp();
  updateHelp();

  document.getElementById('catSaveBtn').onclick = async ()=>{
    const name = document.getElementById('catName').value.trim();
    const group = document.getElementById('catGroup').value.trim() || 'Autres';
    const annual = parseFloat(document.getElementById('catAnnual').value)||0;
    const mode = document.getElementById('catMode').value;
    const dueMonth = mode==='echeance' ? Number(document.getElementById('catDueMonth').value) : null;
    const owner = document.getElementById('catOwner').value;
    const accountId = document.getElementById('catAccount').value || null;
    const icon = document.getElementById('catIcon').value.trim() || null;
    const schedFrom = document.getElementById('catSchedFrom').value;
    const schedTo = document.getElementById('catSchedTo').value;
    const schedAmountRaw = document.getElementById('catSchedAmount').value;
    if(schedFrom && schedTo && schedTo < schedFrom){ toast('La date de fin doit être après la date de début'); return; }
    let scheduledChange = null;
    if(mode==='mensuel' && schedFrom && schedAmountRaw!==''){
      let monthlyAmt = Number(schedAmountRaw);
      if(schedAmountMode==='total' && schedTo){
        const n = monthsBetweenInclusive(schedFrom, schedTo);
        if(n>0) monthlyAmt = Number(schedAmountRaw) / n;
      }
      scheduledChange = {fromKey: schedFrom, toKey: schedTo || null, amount: monthlyAmt};
    }
    if(!name){ toast('Le nom est requis'); return; }
    if(isEdit){
      Object.assign(c, {name, group, annual, mode, dueMonth, type, owner, accountId, icon, scheduledChange});
    } else {
      STATE.config.categories.push({id:uid(), type, name, group, annual, mode, dueMonth, owner, accountId, icon, scheduledChange});
    }
    await saveConfig();
    closeModal();
    toast('Catégorie enregistrée');
    renderBudget();
  };
  if(isEdit){
    document.getElementById('catDeleteBtn').onclick = async ()=>{
      STATE.config.categories = STATE.config.categories.filter(x=>x.id!==c.id);
      await saveConfig();
      closeModal();
      toast('Catégorie supprimée');
      renderBudget();
    };
  }
}

/* ============================= COMPTES ============================= */
function renderAccounts(){
  const el = document.getElementById('screen-accounts');
  const accounts = STATE.config.accounts;
  const total = accounts.reduce((s,a)=>s+soldeTheorique(a),0);
  const groups = {commun:[], moi:[], amelia:[]};
  accounts.forEach(a=>{ (groups[ownerOf(a)] = groups[ownerOf(a)]||[]).push(a); });
  const groupLabel = {commun:'Comptes communs', moi:'Comptes Scott', amelia:'Comptes d’Amélia'};

  el.innerHTML = `
    <div class="topbar">
      <div class="eyebrow">Patrimoine</div>
      <h1>Comptes</h1>
    </div>
    <main>
      <div class="hero-card">
        <div class="card-title">Total (théorique, aujourd'hui)</div>
        <div class="hero-amount">${fmt(total)}</div>
        <div class="hero-sub">Calculé à partir du dernier solde pointé de chaque compte, plus les mouvements enregistrés depuis.</div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <button class="btn btn-primary" style="flex:1" id="addAccBtn">+ Compte</button>
        <button class="btn btn-ghost" style="flex:1" id="virementBtnAcc">↔ Virement</button>
      </div>

      ${['commun','moi','amelia'].filter(o=>groups[o].length).map(o=>`
        <div class="group-header">${groupLabel[o]} · ${fmt(groups[o].reduce((s,a)=>s+soldeTheorique(a),0))}</div>
        <div class="card">
          ${groups[o].map(a=>{
            const reserve = accountEcheanceReserve(a);
            const monthlyB = accountMonthlyBudget(a);
            const extras = [];
            if(monthlyB>0.5) extras.push(`Budget mensuel : ${fmt(monthlyB)}`);
            if(reserve>0.5) extras.push(`Réservé échéances : ${fmt(reserve)} (dispo : ${fmt(soldeTheorique(a)-reserve)})`);
            return `
            <div class="tx-row acc-row" data-id="${a.id}" style="cursor:pointer;">
              <div class="tx-mid">
                <div class="tx-cat">${a.name}</div>
                <div class="tx-meta">Pointé le ${new Date(a.balanceDate).toLocaleDateString('fr-FR')} à ${fmt(a.balance)}${extras.length?' · '+extras.join(' · '):''}</div>
              </div>
              <div class="tx-amt">${fmt(soldeTheorique(a))}</div>
            </div>`;
          }).join('')}
        </div>
      `).join('') || emptyRow()}
      <div class="helper-note">Astuce : quand vous consultez le vrai solde d'un compte en banque, ouvrez-le ici et « pointez » la nouvelle valeur — l'appli recalculera le théorique automatiquement ensuite à partir des mouvements que vous ajoutez. Un compte peut afficher un budget mensuel ou une réserve pour échéances si des catégories lui sont associées dans Budgets.</div>

      <div class="card" style="margin-top:6px;">
        <div class="card-title">Sauvegarde &amp; synchronisation</div>
        <p class="helper-note" style="margin-top:0;">Vos données sont synchronisées en temps réel entre vous deux, en dehors de Claude. Ce bouton te permet en plus de garder une copie de secours à tout moment.</p>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost" style="flex:1" id="exportDataBtn">⬇ Exporter</button>
          <button class="btn btn-ghost" style="flex:1" id="importDataBtn">⬆ Importer</button>
        </div>
        <input type="file" id="importDataFile" accept="application/json" style="display:none">
      </div>
      <div style="text-align:center;margin-top:16px;">
        <span class="logout-link" id="logoutLink">Connecté${auth.currentUser?' en tant que '+auth.currentUser.email:''} · Se déconnecter</span>
      </div>
    </main>
  `;
  document.getElementById('addAccBtn').onclick = ()=> openAccountModal();
  document.getElementById('virementBtnAcc').onclick = ()=> openVirementModal();
  document.getElementById('exportDataBtn').onclick = ()=> exportAllData();
  document.getElementById('importDataBtn').onclick = ()=> document.getElementById('importDataFile').click();
  document.getElementById('importDataFile').onchange = (e)=> { if(e.target.files[0]) importAllData(e.target.files[0]); };
  document.getElementById('logoutLink').onclick = ()=> auth.signOut();

  el.querySelectorAll('.acc-row').forEach(row=>{
    row.onclick = ()=>{
      const a = STATE.config.accounts.find(x=>x.id===row.dataset.id);
      openAccountModal(a);
    };
  });
}
function openAccountModal(a=null){
  const isEdit = !!a;
  openModal(isEdit?'Modifier le compte':'Nouveau compte', `
    <label>Nom du compte</label>
    <input type="text" id="accName" value="${a?a.name:''}" placeholder="ex : Livret A">
    <label>Propriétaire</label>
    <select id="accOwner">
      <option value="commun" ${(!a||ownerOf(a)==='commun')?'selected':''}>Commun</option>
      <option value="moi" ${a&&ownerOf(a)==='moi'?'selected':''}>Scott</option>
      <option value="amelia" ${a&&ownerOf(a)==='amelia'?'selected':''}>Amélia</option>
    </select>
    <label>Solde pointé (€)</label>
    <input type="number" step="0.01" id="accBalance" value="${a?a.balance:'0'}">
    <label>Date de pointage</label>
    <input type="date" id="accDate" value="${a?a.balanceDate:todayISO()}">
    <div class="helper-note">Mettez la date à laquelle ce solde était exact (souvent : aujourd'hui).</div>
  `, `
    ${isEdit?'<button class="btn btn-danger" id="accDeleteBtn">Supprimer</button>':''}
    <button class="btn btn-primary" id="accSaveBtn">Enregistrer</button>
  `);
  document.getElementById('accSaveBtn').onclick = async ()=>{
    const name = document.getElementById('accName').value.trim();
    if(!name){ toast('Le nom est requis'); return; }
    const balance = parseFloat(document.getElementById('accBalance').value)||0;
    const balanceDate = document.getElementById('accDate').value || todayISO();
    const owner = document.getElementById('accOwner').value;
    if(isEdit){ Object.assign(a, {name, balance, balanceDate, owner}); }
    else { STATE.config.accounts.push({id:uid(), name, balance, balanceDate, owner}); }
    await saveConfig();
    closeModal();
    toast('Compte enregistré');
    renderAccounts();
  };
  if(isEdit){
    document.getElementById('accDeleteBtn').onclick = async ()=>{
      STATE.config.accounts = STATE.config.accounts.filter(x=>x.id!==a.id);
      await saveConfig();
      closeModal();
      toast('Compte supprimé');
      renderAccounts();
    };
  }
}

/* ============================= INIT ============================= */
async function init(){
  await loadConfig();
  await loadYear(STATE.currentYear);
  renderShell();
}
</script>
